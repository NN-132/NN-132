<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Nino Chakma, machine learning researcher and MERN developer. Diagram of one federated learning round: five clients send updates to a global model, which sends the improved model back.</title>
<style>
